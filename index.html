<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gravity Flip</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 日本語の案内文用。使う文字だけにサブセット化したもの(tools/import-assets.py で作る) */
  @font-face { font-family: 'DotGothic16'; src: url('assets/fonts/dotgothic16-subset.woff') format('woff'); }
  /* ゲームの箱。画面に固定するので、Safari のタブやアドレスバーが出ていても見えている範囲に収まる */
  #game { position: fixed; inset: 0; }
  /* 名前の入力欄(src/ui/nameInput.js)。スマホでキーボードが出ても見えるよう上に寄せる */
  .name-dialog {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center;
    padding: 12px; background: rgba(10, 10, 30, 0.55); touch-action: manipulation;
  }
  .name-box {
    display: flex; flex-direction: column; gap: 6px; width: min(92vw, 380px); padding: 12px 16px;
    background: #181830; color: #fff; border: 3px solid #fff; box-shadow: 0 0 0 3px #1a1a2e;
    font-family: 'DotGothic16', sans-serif; user-select: text; -webkit-user-select: text;
  }
  .name-box p { margin: 0; }
  .name-title { font-size: 18px; }
  /* iOS は 16px 未満の入力欄にフォーカスすると画面を拡大するので 20px にする */
  .name-field { font: 20px sans-serif; padding: 6px 8px; border: 2px solid #fff; background: #fff; color: #181830; }
  .name-note { font-size: 13px; color: #b4b4d2; }
  .name-error { font-size: 13px; color: #ff8aa8; }
  .name-buttons { display: flex; gap: 10px; justify-content: flex-end; }
  .name-buttons button { font: 18px 'DotGothic16', sans-serif; padding: 6px 16px; border: 2px solid #fff; color: #fff; cursor: pointer; }
  .name-ok { background: #ff5078; }
  .name-cancel { background: #181830; }
  .name-buttons button:focus-visible, .name-field:focus-visible { outline: 3px solid #ffd84a; outline-offset: 2px; }
  #rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
      background: #111; color: #fff; font: 24px sans-serif; text-align: center; padding: 16px;
    }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">📱 スマホを横向きにしてください</div>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
