<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gravity Flip</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
      background: #111; color: #fff; font: 24px sans-serif; text-align: center; padding: 16px;
    }
  }
</style>
</head>
<body>
<div id="rotate">📱 スマホを横向きにしてください</div>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
